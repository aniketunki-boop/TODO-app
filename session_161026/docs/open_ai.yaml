openapi: 3.0.3

# 1. Basic information
info:
  title: Todo API
  description: A small API to create, read, update and delete todos.
  version: 1.0.0

# 2. Where the API runs
servers:
  - url: http://localhost:8080

# 3. All routes
paths:

  # ---------- /v1/todos  (collection: create + list) ----------
  /v1/todos:

    post:                                  # CREATE
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
            example:
              name: Write documentation
      responses:
        "201":
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: Validation error (e.g. empty name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests (rate limited)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:                                   # LIST (with cursor pagination)
      summary: List todos
      parameters:
        - name: limit
          in: query
          description: Number of items per page (max 100)
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: cursor
          in: query
          description: Opaque cursor from the previous page's next_cursor
          schema:
            type: string
      responses:
        "200":
          description: A page of todos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoListResponse"
        "400":
          description: Invalid cursor or invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- /v1/todos/{id}  (single item: get + update + delete) ----------
  /v1/todos/{id}:

    parameters:                            # applies to get, put, delete below
      - name: id
        in: path
        required: true
        description: The todo's ID
        schema:
          type: string
          example: "b7e2c1a4"

    get:                                   # READ ONE
      summary: Get a todo by ID
      responses:
        "200":
          description: The todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:                                   # UPDATE
      summary: Update a todo's name and/or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoRequest"
            example:
              status: completed
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:                                # DELETE
      summary: Delete a todo
      responses:
        "204":
          description: Deleted (no response body)
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# 4. Reusable shapes (so you don't repeat yourself)
components:
  schemas:

    Todo:
      type: object
      properties:
        id:
          type: string
          example: "b7e2c1a4"
        name:
          type: string
          example: Write documentation
        status:
          type: string
          enum: [pending, in_progress, completed]
          example: pending

    CreateTodoRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    UpdateTodoRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [pending, in_progress, completed]

    TodoListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
        next_cursor:
          type: string
          example: "eyJpZCI6ImI3ZTJjMWE0In0"
        has_more:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: todo_not_found
            message:
              type: string
              example: Todo was not found